$('#app').innerHTML=`<div class="pk1"><small>SMAN 15 BANDUNG</small><h2>PRESENSI SISWA</h2><div class="pkm">Kelas: <b>${esc(U.kelas)}</b></div>
<label>Tanggal <input type="date" id="pt" value="${PR.tgl}" min="${minHari()}" max="${hari()}" onchange="prDate(this.value)"> <b>${tgD(PR.tgl)}</b></label>
<div class="kosong" style="padding:6px 0 0">${PR.meta?'Terakhir disimpan: '+wkt(PR.meta.diubah_pada):'Belum ada presensi tersimpan untuk tanggal ini. Siswa yang tidak ditandai dihitung Hadir.'}</div></div>
${PR.err?`<div class="box" style="color:var(--dn)">Gagal memuat siswa: ${esc(PR.err)}</div>`:''}
<div class="pkl">${PR.siswa.map((x,i)=>`<div class="pr ${PR.st[x.id]?'s-'+PR.st[x.id]:''}" id="r_${x.id}"><span class="pn">${i+1}. ${esc(x.nama)}</span><select aria-label="Status ${esc(x.nama)}" onchange="prSet('${x.id}',this.value)"><option value="">—</option>${STS.map(k=>`<option ${PR.st[x.id]==k?'selected':''}>${k}</option>`).join('')}</select></div>`).join('')||'<div class="kosong">Belum ada siswa aktif pada kelas ini.</div>'}</div>
<div class="pkb"><div class="pch" id="pch">${prChips()}</div><div class="row"><button class="b s" onclick="prReset()">Reset Status</button><button class="b" id="psv" onclick="prSave()">Simpan Presensi</button></div></div>`}
function prSet(id,v){if(v)PR.st[id]=v;else delete PR.st[id];$('#r_'+id).className='pr'+(v?' s-'+v:'');$('#pch').innerHTML=prChips()}
async function prDate(v){if(!v||v<minHari()||v>hari()){alert('Tanggal di luar batas yang diizinkan.');return renderPK()}
if(prDirty()&&!confirm('Perubahan yang belum disimpan akan hilang. Lanjutkan?'))return renderPK();PR.tgl=v;await prLoad();renderPK()}
function prReset(){if(!Object.keys(PR.st).length)return alert('Belum ada status yang dipilih.');if(!confirm('Hapus seluruh pilihan status? Semua siswa kembali dihitung Hadir.'))return;PR.st={};renderPK()}
async function prSave(){const c=prCnt(),n=PR.siswa.length;if(!n)return alert('Tidak ada siswa untuk disimpan.');
let m=`Simpan presensi?\n\nKelas ${U.kelas} · ${tgD(PR.tgl)}\nHadir: ${c.Hadir}\nSakit: ${c.Sakit}\nIzin: ${c.Izin}\nAlpa: ${c.Alpa}\nDispen: ${c.Dispen}\nTotal: ${n}`;
if(PR.meta)m+='\n\nData tanggal ini sudah pernah disimpan. Perubahan akan menggantikan data sebelumnya.';if(!confirm(m))return;
$('#psv').disabled=true;const r=await sb.rpc('simpan_presensi',{p_kelas:U.kelas,p_tanggal:PR.tgl,p_items:PR.siswa.map(x=>({siswa_id:x.id,status:PR.st[x.id]||'Hadir'}))});
if(r.error){alert('Gagal menyimpan: '+r.error.message);$('#psv').disabled=false;return}await prLoad();renderPK();alert('Presensi berhasil disimpan.')}
var RK={kelas:'',tgl:hari()};
function prs(){setTimeout(prsLoad,0);return`<h2>Presensi Siswa</h2><div class="fl"><label>Kelas<select onchange="RK.kelas=this.value;prsLoad()"><option value="">Semua kelas (ringkasan)</option>${opt(kelasList(),RK.kelas)}</select></label><label>Tanggal<input type="date" value="${RK.tgl}" onchange="RK.tgl=this.value;prsLoad()"></label></div><div id="rkb" class="box"><div class="kosong">Memuat…</div></div>`}
async function prsLoad(){const bx=$('#rkb');if(!bx||!RK.tgl)return;const g=await sb.from('presensi').select('*').eq('tanggal',RK.tgl);
if(g.error)return bx.innerHTML=`<div class="kosong" style="color:var(--dn)">Gagal memuat: ${esc(g.error.message)}. Pastikan SQL presensi sudah dijalankan.</div>`;
const P=g.data.filter(p=>!RK.kelas||p.kelas==RK.kelas);let D=[];
if(P.length){const ids=P.map(p=>p.id);for(let i=0;;i+=1000){const d=await sb.from('presensi_detail').select('presensi_id,siswa_id,status').in('presensi_id',ids).order('siswa_id').range(i,i+999);D=D.concat(d.data||[]);if(!d.data||d.data.length<1000)break}}
const cn=pid=>{const c={Hadir:0,Sakit:0,Izin:0,Alpa:0,Dispen:0};D.filter(x=>x.presensi_id==pid).forEach(x=>c[x.status]++);return c};
if(RK.kelas){const p=P[0];if(!p)return bx.innerHTML='<div class="kosong">Belum ada data presensi untuk kelas ini pada tanggal tersebut.</div>';
const st={};D.forEach(x=>st[x.siswa_id]=x.status);const c=cn(p.id),L=S.siswa.filter(s=>s.kelas==RK.kelas&&(s.aktif||st[s.id])).sort(cmpS);
return bx.innerHTML=`<p>Kelas <b>${esc(RK.kelas)}</b> · ${tgD(RK.tgl)}<br><span class="kosong" style="padding:0">Terakhir disimpan: ${wkt(p.diubah_pada)} oleh ${esc(gn(p.diubah_oleh)!='-'?gn(p.diubah_oleh):'sie absensi kelas')}</span></p><div class="pch">${Object.entries(c).map(([k,v])=>`<span class="c-${k}">${k}: ${v}</span>`).join('')}</div><table><tr><th>No.</th><th>Nama Siswa</th><th>Status</th></tr>${L.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.nama)}</td><td><span class="sb2 c-${st[s.id]||'Hadir'}">${st[s.id]||'Hadir'}</span></td></tr>`).join('')}</table>`}
const tot={Hadir:0,Sakit:0,Izin:0,Alpa:0,Dispen:0};
const rows=kelasList().map(k=>{const p=P.find(x=>x.kelas==k);if(!p)return`<tr><td>${esc(k)}</td><td colspan="5" class="kosong">Belum diinput</td></tr>`;const c=cn(p.id);Object.keys(c).forEach(x=>tot[x]+=c[x]);return`<tr><td><a href="#" onclick="RK.kelas='${esc(k)}';go('prs');return false">${esc(k)}</a></td>${Object.values(c).map(v=>`<td>${v}</td>`).join('')}</tr>`}).join('');
bx.innerHTML=`<p>Ringkasan seluruh kelas · ${tgD(RK.tgl)}</p><table><tr><th>Kelas</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Dispen</th></tr>${rows}<tr><th>Total</th>${Object.values(tot).map(v=>`<th>${v}</th>`).join('')}</tr></table>`}
var AK=[];
function akk(){setTimeout(akLoad,0);return`<h2>Akun Sie Absensi</h2><div class="box"><p>Setiap kelas memiliki satu akun. Username = kode kelas. Kata sandi dibuat acak oleh sistem dan hanya tampil <b>sekali</b> saat dibuat atau direset. Sampaikan langsung kepada sie absensi kelas yang bersangkutan.</p><p>Alamat login siswa: <b>${esc(location.href.split('#')[0])}#presensi</b></p><button class="b" onclick="akSemua()">Buat akun semua kelas yang belum punya</button></div><div id="akb" class="box"><div class="kosong">Memuat…</div></div>`}
async function akLoad(){const r=await sb.from('akun_kelas').select('*').order('kelas'),b=$('#akb');if(!b)return;if(r.error)return b.innerHTML=`<div class="kosong" style="color:var(--dn)">Gagal memuat: ${esc(r.error.message)}. Pastikan SQL presensi sudah dijalankan.</div>`;AK=r.data;
b.innerHTML=`<table><tr><th>Kelas / Username</th><th>Status</th><th></th></tr>${kelasList().map(k=>{const a=AK.find(x=>x.kelas==k);return a?`<tr><td>${esc(k)}</td><td>${a.aktif?'aktif':'nonaktif'}</td><td><button class="b s" onclick="akReset('${esc(k)}')">Reset sandi</button> <button class="${a.aktif?'d b':'b s'}" onclick="akAktif('${esc(k)}',${!a.aktif})">${a.aktif?'Nonaktifkan':'Aktifkan'}</button></td></tr>`:`<tr><td>${esc(k)}</td><td class="kosong">belum ada akun</td><td><button class="b s" onclick="akBuat('${esc(k)}')">Buat akun</button></td></tr>`}).join('')}</table>`}
async function admK(body){const r=await sb.functions.invoke('kelola-kelas',{body});let m=r.data&&r.data.error;if(!m&&r.error){try{m=(await r.error.context.json()).error}catch(e){m=r.error.message}}if(m){alert('Gagal: '+m);return null}return r.data||{}}
function akTampil(d){const t=(d.akun||[]).map(a=>a.username+'\t'+a.password).join('\n');
$('#dlg').innerHTML=`<h3>Kata sandi akun kelas</h3><p style="color:var(--dn)"><b>Catat sekarang.</b> Kata sandi tidak dapat dilihat lagi setelah jendela ini ditutup.</p>${d.akun&&d.akun.length?`<pre style="white-space:pre-wrap;max-height:50vh;overflow:auto">${esc('Username\tKata sandi\n'+t)}</pre><button class="b s" onclick="navigator.clipboard&&navigator.clipboard.writeText(${esc(JSON.stringify('Username\tKata sandi\n'+t))});this.textContent='Tersalin'">Salin</button> `:'<p>Tidak ada akun baru (semua kelas sudah punya akun).</p>'}<button class="b" onclick="$('#dlg').close()">Tutup</button>`;$('#dlg').onclose=()=>{$('#dlg').innerHTML='';akLoad()};$('#dlg').showModal()}
async function akSemua(){if(!confirm('Buat akun untuk semua kelas yang belum memiliki akun?'))return;const d=await admK({action:'buat_semua'});if(d)akTampil(d)}
async function akBuat(k){const d=await admK({action:'buat',kelas:k});if(d)akTampil(d)}
async function akReset(k){if(!confirm('Reset kata sandi kelas '+k+'? Kata sandi lama tidak berlaku lagi.'))return;const d=await admK({action:'reset',kelas:k});if(d)akTampil(d)}
async function akAktif(k,a){if(!a&&!confirm('Nonaktifkan akun kelas '+k+'?'))return;if(await admK({action:'aktif',kelas:k,aktif:a}))akLoad()}

start();
</script></body></html>
